spring.application.name=stackgpt-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stackgpt}
spring.datasource.username=${POSTGRES_USER:stackgpt}
spring.datasource.password=${POSTGRES_PASSWORD:stackgpt}
# HNSW returns at most ef_search rows; retrieval asks for top 50.
spring.datasource.hikari.connection-init-sql=set hnsw.ef_search = 100
management.endpoints.web.exposure.include=health
stackgpt.backfill.enabled=true
